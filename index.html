<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nevo — intelligent note-taking with automatic categorisation. Notes that organise themselves.">
    <title>Nevo — Notes that organise themselves.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1b1b1b;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --text-footer: #6b635a;
            --button-bg: #1a1816;
            --button-border: rgba(255, 255, 255, 0.48);
            --button-text: #faf8f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 104px 32px 64px;
            gap: 53px;
        }

        .logo {
            width: 79.263px;
            height: 77px;
            flex-shrink: 0;
        }

        .logo img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hero-content {
            width: 100%;
            max-width: 1144px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        h1 {
            font-family: 'Fraunces', 'Instrument Serif', Georgia, serif;
            font-weight: 400;
            font-size: 88px;
            letter-spacing: -2.4px;
            line-height: 1;
            text-align: center;
            font-variation-settings: 'SOFT' 0, 'WONK' 1;
            width: 100%;
        }

        h1 .line-one {
            color: #ffffff;
        }

        h1 .gradient {
            background: linear-gradient(
                -30.5deg,
                #AAFFB9 25%,
                #FF7373 42%,
                #FFE373 65%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .subtitle {
            font-family: 'DM Sans', sans-serif;
            font-weight: 400;
            font-size: 18.4px;
            line-height: 31.28px;
            color: var(--text-muted);
            text-align: center;
            max-width: 572px;
            font-variation-settings: 'opsz' 9;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 49.188px;
            padding: 0 32px;
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--button-border);
            border-radius: 100px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15.2px;
            font-weight: 600;
            text-decoration: none;
            font-variation-settings: 'opsz' 14;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .cta-button:hover {
            opacity: 0.85;
        }

        /* Frame spans the full mac+phone bbox (1243×678) so the phone overhang never clips on narrow viewports. */
        .mockup {
            position: relative;
            width: 1243px;
            max-width: 100%;
            aspect-ratio: 1243 / 678;
            margin-top: 24px;
        }

        .mockup-macos {
            position: absolute;
            top: 0;
            left: 0;
            width: 85.28%;  /* 1060/1243 */
            height: auto;
            display: block;
        }

        .mockup-phone {
            position: absolute;
            top: 28.76%;    /* 195/678 */
            left: 80.77%;   /* 1004/1243 */
            width: 19.23%;  /* 239/1243 */
            height: auto;
            display: block;
            pointer-events: none;
        }

        footer {
            padding: 49px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer p {
            font-family: 'DM Sans', sans-serif;
            font-size: 12.8px;
            line-height: 20.48px;
            color: var(--text-footer);
            font-variation-settings: 'opsz' 9;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            main {
                padding: 80px 24px 48px;
                gap: 40px;
            }

            h1 {
                font-size: clamp(48px, 9vw, 88px);
                letter-spacing: -0.027em;
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 64px 20px 40px;
                gap: 32px;
            }

            .logo {
                width: 56px;
                height: 54px;
            }

            h1 {
                font-size: clamp(40px, 12vw, 64px);
            }

            .subtitle {
                font-size: 16px;
                line-height: 1.6;
            }

            .cta-button {
                height: 44px;
                padding: 0 26px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main>
        <a href="/" class="logo" aria-label="Nevo">
            <img src="images/figma-logo.svg" alt="Nevo">
        </a>

        <div class="hero-content">
            <h1>
                <span class="line-one">Notes that</span><br>
                <span class="gradient">organise themselves</span>
            </h1>

            <p class="subtitle">Nevo captures your thoughts and sorts them automatically &mdash; so you can focus on what you're thinking, not where to put it.</p>

            <a class="cta-button" href="https://testflight.apple.com/join/6EPzCbMQ">Join the beta on TestFlight</a>
        </div>

        <div class="mockup">
            <img src="images/figma-macos.png" alt="Nevo on macOS" class="mockup-macos">
            <img src="images/figma-phone.png" alt="Nevo on iPhone" class="mockup-phone">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Nevo. All rights reserved.</p>
    </footer>

</body>
</html>
